name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: unzip -q jupiter-ai.zip
      - name: Run tests
        working-directory: jupiter-ai
        run: python -m unittest discover -s tests -t . -v
      - name: Install Flet CLI
        run: pip install flet flet-cli
      - name: Build APK
        working-directory: jupiter-ai
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: printf 'y\ny\ny\ny\n' | flet build apk --arch arm64-v8a --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: jupiter-ai-apk
          path: jupiter-ai/build/apk/*.apk
          if-no-files-found: error
